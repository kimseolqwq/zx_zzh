<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="基于多本地大模型融合的手机购买推荐系统" />
    <title>{% block title %}择机 · 手机购买推荐{% endblock %}</title>
    <link rel="stylesheet" href="/static/prototype.css?v=2.0.0" />
    <link rel="stylesheet" href="/static/system.css?v=2.0.0" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">择</span><span>择机</span><small>多模型手机推荐</small></a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">智能推荐</a>
        <a class="nav-link {% if request.url.path.startswith('/phones') %}active{% endif %}" href="/phones">手机库</a>
        <a class="nav-link {% if request.url.path.startswith('/evaluation') %}active{% endif %}" href="/evaluation">系统评估</a>
        <a class="nav-link {% if request.url.path.startswith('/admin') %}active{% endif %}" href="/admin">数据管理</a>
      </nav>
      <div class="status-pill"><i></i> 本地数据服务</div>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer"><span>择机 · 专业技能实训</span><span>本地模型与价格结果仅供课程演示，购买前请以官方结算页为准。</span></footer>
    <div class="toast" id="toast" role="status"></div>
    <script src="/static/site.js?v=2.0.0"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
